name: build-and-deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Действие на Helios
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"
  HELIOS_HOST: helios.cs.ifmo.ru
  HELIOS_USER: s336456
  HELIOS_PORT: "2222"
  HELIOS_PATH: public_html/adaptive-interfaces-review
  HELIOS_URL: https://se.ifmo.ru/~s336456/adaptive-interfaces-review/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'build' }}
      url: ${{ steps.helios.outputs.url || steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Проверка сборки
        if: inputs.action != 'rollback'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: mkdocs build --strict

      - name: Сохранение сборки GitHub Pages
        if: inputs.action != 'rollback' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Публикация GitHub Pages
        id: pages
        if: inputs.action != 'rollback' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Проверка GitHub Pages
        if: inputs.action != 'rollback' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/healthcheck.sh "${{ steps.pages.outputs.page_url }}" "$GITHUB_SHA"

      - name: Настройка SSH
        if: github.event_name != 'pull_request' && vars.DEPLOY_HELIOS == 'true'
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host helios
            HostName $HELIOS_HOST
            User $HELIOS_USER
            Port $HELIOS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Публикация или откат Helios
        id: helios
        if: github.event_name != 'pull_request' && vars.DEPLOY_HELIOS == 'true'
        env:
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
        run: bash scripts/deploy-helios.sh "$DEPLOY_ACTION"

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
