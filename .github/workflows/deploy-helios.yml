name: Helios

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Действие на Helios
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: helios-${{ github.ref }}
  cancel-in-progress: false

env:
  HELIOS_HOST: helios.cs.ifmo.ru
  HELIOS_USER: s336456
  HELIOS_PORT: "2222"
  HELIOS_PATH: public_html/adaptive-interfaces-review
  HELIOS_URL: https://se.ifmo.ru/~s336456/adaptive-interfaces-review/

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
          cache: pip

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Проверка pull request
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Настройка SSH
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host helios
            HostName $HELIOS_HOST
            User $HELIOS_USER
            Port $HELIOS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Публикация или откат
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
        run: bash scripts/deploy-helios.sh "$DEPLOY_ACTION"

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
